name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Install local PostgreSQL test binaries
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install postgresql@17
      - name: Verify Python, Swift, contracts, and live dry run
        run: scripts/verify-foundation.sh "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify local LifeOS workflows and record release gaps
        run: uv run scripts/verify_lifeos.py --local-only --with-postgres --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lifeos"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: foundation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/${{ github.run_id }}-${{ github.run_attempt }}/
            artifacts/verification/${{ github.run_id }}-${{ github.run_attempt }}-lifeos/
          if-no-files-found: error
          retention-days: 14
