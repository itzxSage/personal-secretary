[project]
name = "secretary-service"
version = "0.1.0"
description = "Private local personal secretary service foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=45,<51",
    "fastapi>=0.116,<1",
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2,<2",
    "keyring>=25.6,<26",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "sqlcipher3>=0.6.2,<0.7",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
cloud = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2,<4",
    "basedpyright>=1.31,<2",
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["mac/secretary_service/src/secretary_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["mac/secretary_service/src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "artifacts"]
stubPath = "typings"
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["mac/secretary_service/src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"scripts/**/*.py" = ["T201", "INP001"]
"mac/secretary_service/src/secretary_service/{audit,authority,backup_catalog,backups,canonical,domain_repository,enrollment,export,keys,ledger,leases,lifecycle,migration,models,provider,storage}.py" = ["D105", "D107"]
"mac/secretary_service/src/secretary_service/conversation_api.py" = ["D101", "D105", "D107", "PLR0911"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
