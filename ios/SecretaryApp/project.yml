name: SecretaryApp
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  SecretaryContract:
    type: framework
    platform: iOS
    sources:
      - path: SecretaryApp/Contract
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.SecretaryContract
        GENERATE_INFOPLIST_FILE: YES
  SecretaryClient:
    type: framework
    platform: iOS
    sources:
      - path: SecretaryApp/Client
    dependencies:
      - target: SecretaryContract
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.SecretaryClient
        GENERATE_INFOPLIST_FILE: YES
  SecretaryApp:
    type: application
    platform: iOS
    sources:
      - path: SecretaryApp/App
    dependencies:
      - target: SecretaryClient
      - target: SecretaryContract
      - target: SecretarySurfaces
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.SecretaryApp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 946R3QHA5P
    info:
      path: Generated/SecretaryApp-Info.plist
      properties:
        CFBundleDisplayName: LifeOS
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.lifeos.SecretaryApp
            CFBundleURLSchemes:
              - lifeos
        NSMicrophoneUsageDescription: Secretary uses the microphone only when you explicitly start a voice session.
        NSSpeechRecognitionUsageDescription: LifeOS transcribes your voice on this iPhone when you start a conversation.
        NSFaceIDUsageDescription: LifeOS verifies your identity before approving the calendar changes you reviewed.
        NSLocalNetworkUsageDescription: Secretary connects to your paired Mac on your private network.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SecretarySurfaces:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SecretaryApp/App/ConversationControl.swift
      - path: SecretaryApp/App/ConversationWidget.swift
      - path: SecretaryApp/App/SecretarySurfaceWidgetBundle.swift
      - path: SecretaryApp/App/StartVoiceSessionIntent.swift
    dependencies:
      - target: SecretaryClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.SecretaryApp.Surfaces
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 946R3QHA5P
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SECRETARY_WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/SecretarySurfaces-Info.plist
      properties:
        CFBundleDisplayName: LifeOS Controls
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SecretaryAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecretaryAppTests
    dependencies:
      - target: SecretaryApp
      - target: SecretaryClient
      - target: SecretaryContract
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SecretaryContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecretaryContractTests
    dependencies:
      - target: SecretaryContract
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SecretaryClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecretaryClientTests
    dependencies:
      - target: SecretaryClient
      - target: SecretaryContract
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SecretaryApp:
    build:
      targets:
        SecretaryApp: all
        SecretaryAppTests: [test]
        SecretaryContractTests: [test]
        SecretaryClientTests: [test]
    test:
      targets:
        - SecretaryAppTests
        - SecretaryContractTests
        - SecretaryClientTests
